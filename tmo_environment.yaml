name: tmo_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - scanpy=1.9.6
  - anndata=0.10.3
  - scikit-learn=1.3.2
  - scipy=1.11.4
  - matplotlib=3.7.5
  - seaborn=0.12.2
  - pandas=1.5.3
  - numpy=1.24.4
  - tqdm=4.65.0
  - muon=0.1.7
  - gseapy=1.0.5
  - pytorch=2.1.0  # from conda-forge; if GPU needed, use pytorch-cuda
  - pip:
    - -r requirements.txt  # optional; but we already list main packages